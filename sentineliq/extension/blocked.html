<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SentinelIQ — Threat Intercepted</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red:    #ef4444;
    --red-dk: #7f1d1d;
    --amber:  #f59e0b;
    --slate:  #0f172a;
    --card:   #1e0a0a;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: radial-gradient(ellipse at 20% 20%, #3b0000 0%, #0f172a 50%, #000 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    padding: 24px;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(239,68,68,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(239,68,68,.04) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    animation: gridPulse 4s ease infinite;
  }

  @keyframes gridPulse { 0%,100%{opacity:.6} 50%{opacity:1} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)} 50%{box-shadow:0 0 0 18px rgba(239,68,68,0)} }
  @keyframes scanLine { 0%{top:-2px} 100%{top:100%} }

  .container {
    position: relative;
    width: 100%;
    max-width: 680px;
    animation: fadeUp .4s ease;
  }

  /* Threat level badge */
  .threat-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--red);
    color: #fff;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .2em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 99px;
    margin-bottom: 24px;
    animation: pulse 2s infinite;
  }
  .threat-badge::before {
    content: '';
    width: 6px; height: 6px;
    background: #fff;
    border-radius: 50%;
    animation: pulse 1.2s infinite;
  }

  /* Main card */
  .card {
    background: linear-gradient(135deg, #1c0505 0%, #0f0a0a 100%);
    border: 1px solid rgba(239,68,68,.3);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 32px 80px rgba(0,0,0,.8), 0 0 0 1px rgba(239,68,68,.1);
    position: relative;
  }

  /* Scan line effect */
  .card::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(239,68,68,.6), transparent);
    animation: scanLine 3s linear infinite;
  }

  .card-header {
    padding: 28px 32px 22px;
    border-bottom: 1px solid rgba(239,68,68,.15);
    background: linear-gradient(135deg, rgba(239,68,68,.12), rgba(239,68,68,.04));
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .shield-icon {
    width: 56px; height: 56px;
    background: radial-gradient(circle, rgba(239,68,68,.25), rgba(239,68,68,.05));
    border: 2px solid rgba(239,68,68,.4);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
  }

  .brand { font-size: 10px; font-weight: 900; color: rgba(239,68,68,.8); letter-spacing: .2em; text-transform: uppercase; }
  .header-title { font-size: 22px; font-weight: 900; color: #fca5a5; margin-top: 2px; }
  .risk-chip {
    margin-left: auto;
    background: rgba(239,68,68,.15);
    border: 1px solid rgba(239,68,68,.3);
    color: #f87171;
    font-size: 13px;
    font-weight: 900;
    padding: 6px 16px;
    border-radius: 99px;
    flex-shrink: 0;
  }

  .card-body { padding: 24px 32px; }

  /* URL danger box */
  .url-box {
    background: rgba(239,68,68,.08);
    border: 1px solid rgba(239,68,68,.2);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .url-box .label { font-size: 9px; font-weight: 900; color: var(--red); text-transform: uppercase; letter-spacing: .12em; flex-shrink: 0; }
  .url-box .url-text { font-size: 12px; color: #fca5a5; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Signals */
  .signals-title {
    font-size: 9px; font-weight: 900; color: #6b7280;
    text-transform: uppercase; letter-spacing: .15em;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .signals-title::after { content:''; flex:1; height:1px; background:rgba(255,255,255,.06); }

  .signal-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(239,68,68,.1);
    border: 1px solid rgba(239,68,68,.2);
    color: #fca5a5;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 8px;
    margin: 3px 4px 3px 0;
  }
  .signal-chip::before { content:'⚡'; font-size:10px; }

  .explanation {
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.65;
    margin: 18px 0 8px;
  }
  .action {
    font-size: 11px;
    color: #818cf8;
    font-style: italic;
    margin-bottom: 24px;
  }

  /* Buttons */
  .btn-safe {
    width: 100%;
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: .04em;
    margin-bottom: 10px;
    transition: all .2s;
    box-shadow: 0 4px 20px rgba(16,185,129,.3);
  }
  .btn-safe:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(16,185,129,.4); }

  .proceed-section { margin-top: 4px; }
  .proceed-label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .proceed-label input { margin-top: 2px; accent-color: var(--red); flex-shrink: 0; }
  .proceed-label span { font-size: 11px; color: #64748b; line-height: 1.5; }

  .btn-proceed {
    width: 100%;
    background: transparent;
    border: 1px solid rgba(239,68,68,.3);
    color: #ef4444;
    border-radius: 12px;
    padding: 11px 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    opacity: .4;
    transition: all .2s;
  }
  .btn-proceed:not(:disabled):hover { background: rgba(239,68,68,.08); border-color: var(--red); opacity:1; }
  .btn-proceed:disabled { cursor: not-allowed; }

  /* Footer */
  .card-footer {
    padding: 14px 32px;
    border-top: 1px solid rgba(255,255,255,.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 9px;
    font-weight: 700;
    color: #374151;
    text-transform: uppercase;
    letter-spacing: .1em;
  }
</style>
</head>
<body>
<div class="container">
  <div style="text-align:center;margin-bottom:20px">
    <span class="threat-badge">🛡 SentinelIQ · Threat Intercepted</span>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="shield-icon">🛡️</div>
      <div>
        <div class="brand">SentinelIQ Enterprise Security</div>
        <div class="header-title">Navigation Blocked</div>
      </div>
      <div class="risk-chip" id="risk-chip">Risk 0</div>
    </div>

    <div class="card-body">
      <!-- Destination URL -->
      <div class="url-box">
        <span class="label">⚠ Blocked URL</span>
        <span class="url-text" id="url-display">—</span>
      </div>

      <!-- Signals -->
      <div class="signals-title">Threat Signals Detected</div>
      <div id="signals-container" style="margin-bottom:4px"></div>

      <!-- Explanation -->
      <p class="explanation" id="explanation">Analyzing threat signals...</p>
      <p class="action" id="action-text"></p>

      <!-- Safe exit -->
      <button class="btn-safe" id="safe-btn">
        ← Return to Safety
      </button>

      <!-- Proceed anyway — requires explicit checkbox -->
      <div class="proceed-section">
        <label class="proceed-label">
          <input type="checkbox" id="proceed-check">
          <span>I understand this site has been classified as <strong style="color:#ef4444">MALICIOUS</strong> by SentinelIQ. I accept full responsibility for proceeding to this destination.</span>
        </label>
        <button class="btn-proceed" id="proceed-btn" disabled>
          Proceed to dangerous site anyway →
        </button>
      </div>
    </div>

    <div class="card-footer">
      <span>SentinelIQ Enterprise · Browser Threat Intelligence</span>
      <span id="timestamp"></span>
    </div>
  </div>
</div>

<script src="blocked.js"></script>
</body>
</html>
