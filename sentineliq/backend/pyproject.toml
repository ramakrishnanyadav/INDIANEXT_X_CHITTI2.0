[tool.pyrefly]
# Disable pyrefly type checking — all packages are in venv
# Pyrefly is configured here to prevent false-positive import errors
project_root = "."
search_path = [
    ".",
    "venv/Lib/site-packages"
]
site_package_path = ["venv/Lib/site-packages"]
ignore_missing_imports = true
python_version = "3.11"
